workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      xcode: latest
    scripts:
      - name: Build
        script: |
          xcodebuild -project swiftui-elements.xcodeproj \
          -scheme swiftui-elements \
          -sdk iphoneos \
          -configuration Release \
          build
    artifacts:
      - build/**/*.ipa
